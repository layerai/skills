name: Links

# Every factual claim in a skill is supposed to be verifiable from a public surface,
# and the skills carry the links that prove it. A link that rots takes the grounding
# with it, so this runs weekly as well as on pull requests.

on:
  pull_request:
    branches: [main]
  schedule:
    # 08:00 UTC on Mondays.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --accept 200,206,429
            --exclude-path node_modules
            --exclude '^https://github\.com/layerai/skills/security/advisories/new$'
            --exclude '^mailto:'
            --exclude '^https://mcp\.app\.layer\.ai/mcp$'
            './**/*.md'
          fail: true
